name: Final verified engine upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/engine-upgrade-v4.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply upgrade
        run: node scripts/one-shot-engine-upgrade-v4.mjs
      - name: Sync browser maps
        run: npm run sync:docs-maps
      - name: Verify all tests and syntax
        run: |
          npm test
          npm run check
      - name: Commit verified production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini-watermark-remover-light.user.js docs/app.js docs/maps.js tests/userscript.test.mjs CHANGELOG.md .github/workflows/ci.yml
          git commit -m "Improve current Gemini watermark detection"
          git push
