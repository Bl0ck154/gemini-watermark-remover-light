name: One-shot Light engine upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/one-shot-engine-upgrade.mjs
      - scripts/run-one-shot-engine-upgrade.mjs
      - .github/workflows/one-shot-engine-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply engine upgrade
        run: node scripts/run-one-shot-engine-upgrade.mjs
      - name: Synchronize web calibration maps
        run: npm run sync:docs-maps
      - name: Verify
        run: |
          npm test
          npm run check
      - name: Commit upgraded engine
        run: |
          rm .github/workflows/one-shot-engine-upgrade.yml scripts/one-shot-engine-upgrade.mjs scripts/run-one-shot-engine-upgrade.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve current Gemini watermark detection"
          git push
